<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Cue — Program Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --stage:#0B0D10;
    --panel:#14171C;
    --panel-2:#1B1F26;
    --line:#2A2F38;
    --paper:#EDEAE2;
    --muted:#7C8494;
    --amber:#FFB020;
    --green:#34D399;
    --red:#FF4D4D;
    --state-color: var(--green);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    height:100%;
    background:var(--stage);
    color:var(--paper);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    transition:background-color .4s ease;
  }

  body.is-over{
    animation:flash 1s steps(1,end) infinite;
  }
  @keyframes flash{
    0%,49%{ background-color:var(--stage); }
    50%,100%{ background-color:#2A0E0E; }
  }
  @media (prefers-reduced-motion: reduce){
    body.is-over{ animation:none; background-color:#2A0E0E; }
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    gap:12px;
  }

  .modes{
    display:flex;
    gap:4px;
    background:var(--panel);
    border:1px solid var(--line);
    padding:4px;
  }

  .mode-btn{
    appearance:none;
    background:transparent;
    border:0;
    color:var(--muted);
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    letter-spacing:.02em;
    padding:8px 16px;
    cursor:pointer;
  }
  .mode-btn.active{
    background:var(--panel-2);
    color:var(--paper);
  }
  .mode-btn:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }

  .icon-row{
    display:flex;
    gap:8px;
  }

  .icon-btn{
    appearance:none;
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--muted);
    cursor:pointer;
  }
  .icon-btn:hover{ color:var(--paper); border-color:#3A4150; }
  .icon-btn.on{ color:var(--amber); border-color:var(--amber); }
  .icon-btn svg{ width:18px; height:18px; }

  /* ---------- Main stage ---------- */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    text-align:center;
    gap:18px;
  }

  .status-label{
    font-size:13px;
    letter-spacing:.14em;
    color:var(--muted);
    min-height:18px;
  }

  .digits{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    font-size:clamp(72px, 18vw, 220px);
    line-height:1;
    color:var(--state-color);
    transition:color .4s ease;
    letter-spacing:-.01em;
    user-select:none;
  }

  .sub-label{
    font-size:15px;
    color:var(--muted);
  }

  .bar-track{
    width:min(560px, 90vw);
    height:6px;
    background:var(--panel-2);
    border:1px solid var(--line);
  }
  .bar-fill{
    height:100%;
    width:100%;
    background:var(--state-color);
    transition:width 1s linear, background-color .4s ease;
  }

  /* ---------- Controls ---------- */
  .controls{
    border-top:1px solid var(--line);
    padding:22px 24px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  .set-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .time-field{
    display:flex;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--line);
  }
  .time-field button{
    appearance:none;
    background:transparent;
    border:0;
    color:var(--muted);
    width:34px;
    height:44px;
    font-size:16px;
    cursor:pointer;
  }
  .time-field button:hover{ color:var(--paper); }
  .time-field input{
    width:52px;
    text-align:center;
    background:transparent;
    border:0;
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:18px;
    font-weight:500;
    padding:0;
  }
  .time-field input::-webkit-outer-spin-button,
  .time-field input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .time-field-label{
    font-size:11px;
    color:var(--muted);
    letter-spacing:.08em;
    margin-top:4px;
    text-align:center;
  }
  .field-group{ display:flex; flex-direction:column; align-items:center; }
  .colon{ color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:20px; padding-top:0; }

  .presets{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .preset{
    appearance:none;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    font-family:inherit;
    font-size:13px;
    padding:7px 14px;
    cursor:pointer;
  }
  .preset:hover{ color:var(--paper); border-color:#3A4150; }

  .action-row{
    display:flex;
    gap:10px;
  }

  .btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--paper);
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    padding:12px 28px;
    cursor:pointer;
    letter-spacing:.02em;
  }
  .btn:hover{ border-color:#3A4150; }
  .btn.primary{
    background:var(--amber);
    border-color:var(--amber);
    color:#1A1200;
  }
  .btn.primary:hover{ filter:brightness(1.07); }
  .btn.stop{
    background:var(--red);
    border-color:var(--red);
    color:#2A0000;
  }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }

  .hidden{ display:none !important; }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    padding:10px;
    letter-spacing:.04em;
  }

  @media (max-width:480px){
    html,body{ overflow-x:hidden; }
    .topbar{
      align-items:stretch;
      padding:12px 14px;
      gap:10px;
    }
    .modes{ flex:1; }
    .mode-btn{ flex:1; padding:10px 8px; font-size:13px; }
    .icon-row{ justify-content:flex-end; }
    .stage{ min-height:260px; padding:28px 14px; gap:14px; }
    .status-label{ font-size:11px; }
    .digits{ font-size:clamp(58px, 21vw, 112px); max-width:100%; overflow:hidden; }
    .sub-label{ font-size:13px; }
    .bar-track{ width:min(100%, 360px); }
    .controls{ padding:18px 14px 22px; gap:16px; }
    .set-row{ width:100%; }
    .time-field{ min-height:46px; }
    .time-field button{ width:38px; height:46px; }
    .presets{ width:100%; gap:7px; }
    .preset{ flex:1 1 calc(33.333% - 7px); padding:9px 6px; min-width:0; }
    .action-row{ width:100%; flex-wrap:wrap; gap:8px; }
    .action-row .btn{ flex:1 1 calc(50% - 8px); min-height:46px; padding:12px 10px; }
    .action-row .btn.stop{ flex-basis:100%; }
    .btn{ padding:12px 18px; font-size:13px; }
    footer{ padding:8px 14px 12px; line-height:1.5; }
  }

  @media (max-width:360px){
    .topbar{ padding-inline:10px; }
    .mode-btn{ font-size:12px; }
    .icon-btn{ width:38px; height:38px; }
    .controls{ padding-inline:10px; }
    .preset{ font-size:12px; }
  }

  /* ---------- Welcome screen ---------- */
  .welcome{
    position:fixed;
    inset:0;
    z-index:50;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0;
    background:
      radial-gradient(circle at 50% 38%, rgba(42, 71, 202, .24), transparent 31%),
      linear-gradient(135deg, #060a18 0%, #0b1230 48%, #111b47 100%);
    padding:32px 20px;
    text-align:center;
    transition:opacity .5s ease;
  }
  .welcome::before,
  .welcome::after{
    content:"";
    position:absolute;
    pointer-events:none;
    border:1px solid rgba(135, 157, 255, .17);
    border-radius:50%;
    animation:orbit 16s linear infinite;
  }
  .welcome::before{ width:min(74vw, 720px); aspect-ratio:1; top:-18%; left:-24%; }
  .welcome::after{ width:min(58vw, 560px); aspect-ratio:1; right:-18%; bottom:-24%; animation-direction:reverse; animation-duration:21s; }
  @keyframes orbit{ to{ transform:rotate(360deg); } }
  .welcome-inner{
    position:relative;
    z-index:1;
    width:min(100%, 620px);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .welcome-kicker{
    order:-2;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
    color:#9eafff;
    font-family:'DM Mono', monospace;
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
  }
  .welcome-kicker::before,
  .welcome-kicker::after{ content:""; width:24px; height:1px; background:#5469d7; }
  .sponsor-mark{
    position:relative;
    padding:12px 20px;
    border:1px solid rgba(255,255,255,.42);
    box-shadow:0 18px 50px rgba(0,0,0,.26);
    animation:logo-arrive .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes logo-arrive{ from{ opacity:0; transform:translateY(-18px) scale(.94); } to{ opacity:1; transform:none; } }
  .sponsor-mark img{ height:clamp(112px, 18vw, 148px); }
  .welcome.leaving{
    opacity:0;
    pointer-events:none;
  }
  .welcome-mark{
    order:0;
    margin-top:32px;
    color:#fff;
    font-family:'Manrope', sans-serif;
    font-size:clamp(34px, 7vw, 62px);
    font-weight:800;
    letter-spacing:-.045em;
    line-height:1.04;
    text-wrap:balance;
    animation:copy-arrive .8s .15s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes copy-arrive{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
  .welcome-tagline{
    order:1;
    max-width:450px;
    margin:18px auto 28px;
    font-size:clamp(14px, 2.5vw, 16px);
    line-height:1.65;
    color:#b9c4eb;
    animation:copy-arrive .8s .25s cubic-bezier(.2,.8,.2,1) both;
  }
  .welcome-steps{
    display:flex;
    flex-direction:column;
    gap:10px;
    text-align:left;
    border-left:1px solid var(--line);
    padding-left:18px;
    max-width:360px;
  }
  .welcome-steps div{
    font-size:14px;
    color:var(--paper);
  }
  .welcome-steps span{
    color:var(--muted);
  }
  body.welcome-active{ overflow:hidden; }
  body.welcome-active .topbar,
  body.welcome-active .stage,
  body.welcome-active .controls,
  body.welcome-active footer{
    visibility:hidden;
  }

  .sponsor{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    margin-bottom:26px;
    order:-1;
  }
  .sponsor-label{
    font-family:'DM Mono', monospace;
    font-size:10px;
    letter-spacing:.16em;
    color:#8495ec;
    text-transform:uppercase;
  }
  .welcome .btn.primary{
    order:2;
    min-width:190px;
    padding:15px 28px;
    border:0;
    border-radius:999px;
    background:#fff;
    color:#101a50;
    font-family:'Manrope', sans-serif;
    font-size:14px;
    font-weight:800;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    animation:copy-arrive .8s .35s cubic-bezier(.2,.8,.2,1) both;
  }
  .welcome .btn.primary:hover{ transform:translateY(-2px); filter:none; box-shadow:0 14px 34px rgba(0,0,0,.32); }
  .welcome .btn.primary::after{ content:"  →"; font-size:18px; line-height:0; vertical-align:-1px; }
  .welcome-steps{ display:none; }
  @media (max-width:480px){
    .welcome{ justify-content:flex-start; padding:15vh 18px 28px; }
    .welcome-kicker{ margin-bottom:16px; font-size:9px; letter-spacing:.14em; }
    .sponsor{ margin-bottom:20px; }
    .sponsor-mark{ padding:8px 12px; }
    .sponsor-mark img{ height:clamp(105px, 30vw, 132px); }
    .welcome-mark{ margin-top:25px; }
    .welcome-tagline{ margin:15px auto 24px; max-width:320px; }
  }
  @media (prefers-reduced-motion: reduce){
    .welcome::before,.welcome::after,.sponsor-mark,.welcome-mark,.welcome-tagline,.welcome .btn.primary{ animation:none; }
  }
</style>
</head>

<div class="topbar">
  <div class="modes" role="tablist" aria-label="Timer mode">
    <button class="mode-btn active" data-mode="countdown" role="tab" aria-selected="true">Countdown</button>
    <button class="mode-btn" data-mode="alarm" role="tab" aria-selected="false">Alarm</button>
  </div>
  <div class="icon-row">
    <button class="icon-btn on" id="soundBtn" title="Toggle sound" aria-label="Toggle sound">
      <svg id="soundIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg id="soundIconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hidden"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M17 9l6 6M23 9l-6 6"/></svg>
    </button>
    <button class="icon-btn" id="fullscreenBtn" title="Fullscreen for projector" aria-label="Toggle fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
    </button>
  </div>
</div>

<main class="stage">
  <div class="status-label" id="statusLabel">READY</div>
  <div class="digits" id="digits">05:00</div>
  <div class="sub-label" id="subLabel">Speaker time remaining</div>
  <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
</main>

<div class="controls">

  <div id="countdownSet" class="set-row">
    <div class="field-group">
      <div class="time-field">
        <button type="button" data-adjust="min" data-dir="-1" aria-label="Decrease minutes">–</button>
        <input type="number" id="minInput" value="5" min="0" max="180" aria-label="Minutes">
        <button type="button" data-adjust="min" data-dir="1" aria-label="Increase minutes">+</button>
      </div>
      <div class="time-field-label">MIN</div>
    </div>
    <div class="colon">:</div>
    <div class="field-group">
      <div class="time-field">
        <button type="button" data-adjust="sec" data-dir="-1" aria-label="Decrease seconds">–</button>
        <input type="number" id="secInput" value="0" min="0" max="59" aria-label="Seconds">
        <button type="button" data-adjust="sec" data-dir="1" aria-label="Increase seconds">+</button>
      </div>
      <div class="time-field-label">SEC</div>
    </div>
  </div>

  <div id="alarmSet" class="set-row hidden">
    <div class="field-group">
      <div class="time-field" style="padding:0 8px;">
        <input type="time" id="alarmInput" value="09:00" aria-label="Alarm time" style="width:120px; text-align:center;">
      </div>
      <div class="time-field-label">RINGS AT</div>
    </div>
  </div>

  <div class="presets" id="presets">
    <button class="preset" data-preset="60">1 min</button>
    <button class="preset" data-preset="180">3 min</button>
    <button class="preset" data-preset="300">5 min</button>
    <button class="preset" data-preset="600">10 min</button>
    <button class="preset" data-preset="900">15 min</button>
  </div>

  <div class="action-row">
    <button class="btn primary" id="startBtn">Start</button>
    <button class="btn hidden" id="pauseBtn">Pause</button>
    <button class="btn" id="resetBtn">Reset</button>
    <button class="btn stop hidden" id="stopBtn">Stop buzzer</button>
  </div>
</div>

<footer>Runs entirely in this tab — closing or refreshing stops the timer.</footer>

<script>
(function(){
  const modeBtns = document.querySelectorAll('.mode-btn');
  const countdownSet = document.getElementById('countdownSet');
  const alarmSet = document.getElementById('alarmSet');
  const presets = document.getElementById('presets');
  const digits = document.getElementById('digits');
  const statusLabel = document.getElementById('statusLabel');
  const subLabel = document.getElementById('subLabel');
  const barFill = document.getElementById('barFill');
  const minInput = document.getElementById('minInput');
  const secInput = document.getElementById('secInput');
  const alarmInput = document.getElementById('alarmInput');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const stopBtn = document.getElementById('stopBtn');
  const soundBtn = document.getElementById('soundBtn');
  const soundIconOn = document.getElementById('soundIconOn');
  const soundIconOff = document.getElementById('soundIconOff');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const root = document.documentElement;

  let mode = 'countdown';
  let totalSeconds = 300;
  let remaining = 300;
  let running = false;
  let intervalId = null;
  let soundOn = true;
  let audioCtx = null;
  let buzzerNode = null;
  let countdownTimeout = null;
  let warningTwoMinutesPlayed = false;
  let warningOneMinutePlayed = false;
  const originalTitle = document.title;

  function pad(n){ return String(n).padStart(2,'0'); }

  function fmt(sec){
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec/3600);
    const m = Math.floor((sec%3600)/60);
    const s = sec%60;
    if(h>0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
    return `${pad(m)}:${pad(s)}`;
  }

  function setState(state){
    // state: safe | warn | over
    const colorMap = { safe: 'var(--green)', warn: 'var(--amber)', over: 'var(--red)' };
    root.style.setProperty('--state-color', colorMap[state]);
  }

  function render(){
    digits.textContent = fmt(remaining);
    if(mode === 'countdown' && totalSeconds > 0){
      const pct = Math.max(0, Math.min(100, (remaining/totalSeconds)*100));
      barFill.style.width = pct + '%';
      if(remaining <= 0){ setState('over'); }
      else if(pct <= 20){ setState('warn'); }
      else { setState('safe'); }
    } else if(mode === 'alarm'){
      barFill.style.width = '100%';
      setState(remaining <= 0 ? 'over' : 'safe');
    }
    if(running) document.title = fmt(remaining) + ' · ' + originalTitle;
    else document.title = originalTitle;
  }

  function switchMode(newMode){
    if(running) stopTimer(false);
    mode = newMode;
    modeBtns.forEach(b=>{
      const active = b.dataset.mode === mode;
      b.classList.toggle('active', active);
      b.setAttribute('aria-selected', active);
    });
    countdownSet.classList.toggle('hidden', mode !== 'countdown');
    alarmSet.classList.toggle('hidden', mode !== 'alarm');
    presets.classList.toggle('hidden', mode !== 'countdown');
    subLabel.textContent = mode === 'countdown' ? 'Speaker time remaining' : 'Time until alarm';
    resetTimer();
  }

  modeBtns.forEach(b => b.addEventListener('click', () => switchMode(b.dataset.mode)));

  // ---- countdown +/- inputs ----
  document.querySelectorAll('[data-adjust]').forEach(btn=>{
    btn.addEventListener('click', () => {
      const field = btn.dataset.adjust === 'min' ? minInput : secInput;
      const dir = parseInt(btn.dataset.dir, 10);
      let val = parseInt(field.value || '0', 10) + dir;
      const max = parseInt(field.max, 10);
      if(val < 0) val = 0;
      if(val > max) val = max;
      field.value = val;
      syncFromInputs();
    });
  });
  [minInput, secInput].forEach(inp => inp.addEventListener('change', syncFromInputs));

  function syncFromInputs(){
    if(running) return;
    const m = Math.max(0, parseInt(minInput.value || '0', 10));
    const s = Math.max(0, Math.min(59, parseInt(secInput.value || '0', 10)));
    totalSeconds = m*60 + s;
    remaining = totalSeconds;
    render();
  }

  presets.querySelectorAll('.preset').forEach(p=>{
    p.addEventListener('click', () => {
      const sec = parseInt(p.dataset.preset, 10);
      minInput.value = Math.floor(sec/60);
      secInput.value = sec%60;
      syncFromInputs();
    });
  });

  alarmInput.addEventListener('change', () => { if(!running) computeAlarmRemaining(); });

  function computeAlarmRemaining(){
    const [h,m] = alarmInput.value.split(':').map(Number);
    const now = new Date();
    const target = new Date();
    target.setHours(h, m, 0, 0);
    if(target <= now) target.setDate(target.getDate()+1);
    remaining = Math.round((target - now)/1000);
    totalSeconds = remaining;
    render();
  }

  // ---- timer control ----
  function startTimer(){
    if(running) return;
    if(mode === 'alarm') computeAlarmRemaining();
    if(remaining <= 0 && mode === 'countdown') remaining = totalSeconds = (parseInt(minInput.value||'0',10)*60 + parseInt(secInput.value||'0',10));
    if(remaining <= 0) return;
    running = true;
    startBtn.classList.add('hidden');
    pauseBtn.classList.remove('hidden');
    if(mode === 'countdown'){
      beginStartCountdown();
    } else {
      statusLabel.textContent = 'WAITING';
      intervalId = setInterval(tick, 1000);
    }
  }

  function beginStartCountdown(){
    let count = 3;
    statusLabel.textContent = 'GET READY';
    function nextCue(){
      if(!running) return;
      if(count > 0){
        digits.textContent = count;
        playTone(520 + (3 - count) * 60, 0.16, 'sine', 0.42);
        count -= 1;
        countdownTimeout = setTimeout(nextCue, 700);
        return;
      }
      digits.textContent = fmt(remaining);
      statusLabel.textContent = 'RUNNING';
      playTone(1040, 0.3, 'triangle', 0.58);
      intervalId = setInterval(tick, 1000);
      countdownTimeout = null;
    }
    countdownTimeout = setTimeout(nextCue, 700);
  }

  function tick(){
    if(mode === 'alarm'){
      computeAlarmRemaining();
    } else {
      remaining -= 1;
    }
    if(mode === 'countdown' && remaining === 120 && !warningTwoMinutesPlayed){
      warningTwoMinutesPlayed = true;
      playTone(660, 0.28, 'triangle', 0.5);
    }
    if(mode === 'countdown' && remaining === 60 && !warningOneMinutePlayed){
      warningOneMinutePlayed = true;
      playTone(780, 0.28, 'triangle', 0.5);
    }
    render();
    if(remaining <= 0){
      clearInterval(intervalId);
      running = false;
      triggerBuzzer();
    }
  }

  function pauseTimer(){
    if(!running) return;
    running = false;
    if(countdownTimeout){ clearTimeout(countdownTimeout); countdownTimeout = null; }
    clearInterval(intervalId);
    statusLabel.textContent = 'PAUSED';
    startBtn.classList.remove('hidden');
    startBtn.textContent = 'Resume';
    pauseBtn.classList.add('hidden');
  }

  function resetTimer(stopAudio = true){
    if(countdownTimeout){ clearTimeout(countdownTimeout); countdownTimeout = null; }
    clearInterval(intervalId);
    running = false;
    if(stopAudio) stopBuzzer();
    document.body.classList.remove('is-over');
    startBtn.classList.remove('hidden');
    startBtn.textContent = 'Start';
    pauseBtn.classList.add('hidden');
    stopBtn.classList.add('hidden');
    warningTwoMinutesPlayed = false;
    warningOneMinutePlayed = false;
    statusLabel.textContent = 'READY';
    if(mode === 'countdown'){
      totalSeconds = (parseInt(minInput.value||'0',10)*60 + parseInt(secInput.value||'0',10));
      remaining = totalSeconds;
    } else {
      computeAlarmRemaining();
    }
    setState('safe');
    render();
  }

  function stopTimer(reset = true){
    if(countdownTimeout){ clearTimeout(countdownTimeout); countdownTimeout = null; }
    clearInterval(intervalId);
    running = false;
    if(reset) resetTimer();
  }

  startBtn.addEventListener('click', startTimer);
  pauseBtn.addEventListener('click', pauseTimer);
  resetBtn.addEventListener('click', () => resetTimer());
  stopBtn.addEventListener('click', () => { stopBuzzer(); resetTimer(false); });

  // ---- buzzer sound (Web Audio, no external files) ----
  function ensureAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function triggerBuzzer(){
    statusLabel.textContent = "TIME'S UP";
    document.body.classList.add('is-over');
    stopBtn.classList.remove('hidden');
    pauseBtn.classList.add('hidden');
    startBtn.classList.add('hidden');
    if(soundOn) playBuzzer();
  }

  function playTone(frequency, duration, type, volume){
    if(!soundOn) return;
    ensureAudio();
    const ctx = audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = frequency;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + 0.015);
    gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration + 0.03);
  }

  function playBuzzer(){
    ensureAudio();
    stopBuzzer();
    const ctx = audioCtx;
    let beepOn = true;
    function beep(){
      if(!beepOn) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 0.015);
      gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    }
    beep();
    buzzerNode = setInterval(beep, 600);
  }

  function stopBuzzer(){
    if(buzzerNode){ clearInterval(buzzerNode); buzzerNode = null; }
  }

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.classList.toggle('on', soundOn);
    soundIconOn.classList.toggle('hidden', !soundOn);
    soundIconOff.classList.toggle('hidden', soundOn);
    if(!soundOn) stopBuzzer();
    ensureAudio();
  });

  // ---- fullscreen ----
  fullscreenBtn.addEventListener('click', () => {
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  });

  // ---- welcome screen ----
  const welcomeScreen = document.getElementById('welcomeScreen');
  const enterBtn = document.getElementById('enterBtn');

  function enterApp(){
    ensureAudio(); // unlock audio on the user gesture so the buzzer can play later
    welcomeScreen.classList.add('leaving');
    document.body.classList.remove('welcome-active');
    setTimeout(() => welcomeScreen.remove(), 500);
  }
  enterBtn.addEventListener('click', enterApp);
  document.addEventListener('keydown', (e) => {
    if(document.body.classList.contains('welcome-active') && (e.key === 'Enter' || e.key === ' ')){
      e.preventDefault();
      enterApp();
    }
  });

  // init
  computeAlarmRemainingSafe();
  function computeAlarmRemainingSafe(){
    try{ computeAlarmRemaining(); } catch(e){}
    resetTimer();
  }
})();
</script>

</body>
